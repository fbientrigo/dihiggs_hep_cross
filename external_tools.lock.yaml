# External physics tools this repo interoperates with, pinned in one place.
#
# Purpose: give the three-repo ecosystem (dihiggs, dihiggs_boundary,
# dihiggs_hep_cross) a single, diffable manifest of which upstream tool
# versions each repo builds against, so version drift is detectable instead of
# hidden in directory names and build scripts. The declared versions must AGREE
# across the three manifests -- that agreement is the cross-repo "version pin".
# tests/test_external_tools.py enforces the versions and the convention-cache SHA-256 and provenance sidecar.
#
# This repo is the LLP-recast layer: it vendors NEITHER 2HDMC nor HiggsTools.
# It still declares the expected versions so a model point handed to it from
# dihiggs / dihiggs_boundary is known to have been produced with the same
# tool versions (vendored_path is null here).
schema_version: external_tools_v1

# Controlled cache of the canonical physics convention file.
# The SHA-256 pins the canonical v3 convention cache; provenance is in its sidecar.
conventions:
  file: conventions/physics_conventions.yaml
  provenance_file: conventions/physics_conventions.lock.yaml
  schema_version: physics_conventions_v3
  sha256: 4f3a938ed54dbc779d25f691ce1dd06fe17af69751105dc3b69ccb6b7d92fff6

tools:
  2HDMC:
    version: "1.8"
    upstream_url: https://2hdmc.hepforge.org/
    distribution: tarball
    vendored_path: null            # not vendored in this repo
    local_patches: []

  HiggsTools:
    version: v1.2
    upstream_url: https://gitlab.com/higgsbounds/higgstools
    upstream_ref: v1.2
    distribution: git
    vendored_path: null            # not vendored in this repo
    local_patches: []

  HiggsBounds_dataset:
    version: v1.7
    upstream_url: https://gitlab.com/higgsbounds/hbdataset
    upstream_ref: v1.7
    distribution: git
    vendored_path: null
    local_patches: []

  HiggsSignals_dataset:
    version: v1.1
    upstream_url: https://gitlab.com/higgsbounds/hsdataset
    upstream_ref: v1.1
    distribution: git
    vendored_path: null
    local_patches: []
