  <text x="90" y="125" text-anchor="end" class="small">5</text>
  <line x1="110" y1="320" x2="1110" y2="320" class="threshold"/>
  <text x="1090" y="305" text-anchor="end" class="label strong">ATLAS S95obs = 3.0</text>
  <text x="1090" y="345" text-anchor="end" class="small">σvis = 3/139 = 0.02158 fb (publicado: 0.022 fb)</text>
  <rect x="255" y="105" width="3" height="515" class="valid"/>
  <text x="270" y="145" class="small">ventana 2HDM válida</text>
  <text x="270" y="167" class="small">κ ≃ 1 ± O(10⁻¹⁰)</text>
  <polyline points="180,607 255,591 330,570 405,544 480,513 555,475 630,432 705,383 780,328 855,267 930,201 1005,128" class="curve"/>
  <text x="790" y="390" class="label">N = 0.2884 κ²</text>
  <circle cx="255" cy="591" r="8" fill="#2468a2"/>
  <text x="275" y="580" class="label strong">R8: κ=1, N=0.288</text>
  <rect x="738" y="312" width="16" height="16" fill="#a33"/>
  <line x1="746" y1="312" x2="675" y2="250" stroke="#a33" stroke-width="2"/>
  <text x="665" y="225" text-anchor="middle" class="label strong">κ = 3.225</text>
  <text x="665" y="248" text-anchor="middle" class="label">|g| = 205.1 GeV</text>
  <text x="610" y="680" text-anchor="middle" class="label">multiplicador del acoplamiento κg</text>
  <text x="30" y="365" text-anchor="middle" class="label" transform="rotate(-90 30 365)">eventos Trackless esperados a 139 fb⁻¹</text>
