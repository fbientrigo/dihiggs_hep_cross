<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="white"/>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #222; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 18px; }
    .axis { stroke: #333; stroke-width: 2; }
    .grid { stroke: #ddd; stroke-width: 1; }
    .curve { fill: none; stroke: #2468a2; stroke-width: 4; }
    .threshold { stroke: #a33; stroke-width: 3; stroke-dasharray: 10 8; }
    .valid { fill: #4a4; opacity: .28; }
    .label { font-size: 17px; }
    .small { font-size: 15px; }
    .strong { font-weight: 700; }
  </style>
  <text x="600" y="45" text-anchor="middle" class="title">R9 — Umbral oficial Trackless</text>
  <text x="600" y="75" text-anchor="middle" class="subtitle">N = 0.2884 κ²; ATLAS Table 6: S95 observado = 3.0 eventos</text>
  <line x1="110" y1="620" x2="1110" y2="620" class="axis"/>
